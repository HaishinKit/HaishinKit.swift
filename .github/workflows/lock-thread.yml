name: 'Lock Threads'
on:
  schedule:
    - cron: '0 1 * * 1,4'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: lock
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '60'
          process-only: 'issues'
