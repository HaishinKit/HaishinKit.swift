name: Review
on: [pull_request]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.6.app'
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Test report checks
        run: |
          bundle exec ruby fastlane/tests/publish_test_results_test.rb
          bundle exec ruby fastlane/tests/publish_documentation_results_test.rb
      - name: fastlane
        id: review
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p test-results
          set -o pipefail
          bundle exec fastlane review 2>&1 | tee test-results/review.log
      - name: Annotate test failures and summarize results
        if: always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        run: bundle exec fastlane run publish_test_results outcome:'${{ steps.review.outcome }}'
      - name: Upload test logs and XML
        if: always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: |
            test-results/*.xml
            test-results/review.log
          retention-days: 14
          if-no-files-found: error
