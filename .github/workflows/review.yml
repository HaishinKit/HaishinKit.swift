name: Review
on: [pull_request]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.6.app'
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Test report checks
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_test_report.py'
      - name: fastlane
        id: review
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p test-results
          set -o pipefail
          bundle exec fastlane review 2>&1 | tee test-results/review.log
      - name: Generate test report
        if: always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        run: python3 .github/scripts/test_report.py test-results --outcome '${{ steps.review.outcome }}' --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        id: html
        if: always() && hashFiles('test-results/test-results.html') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: test-results/test-results.html
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Link HTML report
        if: always() && steps.html.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.html.outputs.artifact-url }}
        run: printf '\n[Open HTML test report](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs and XML
        if: always() && (steps.review.outcome == 'success' || steps.review.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: |
            test-results/*.xml
            test-results/review.log
          retention-days: 14
          if-no-files-found: error
