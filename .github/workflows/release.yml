name: Release
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Documentation version to generate and publish'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate documentation version
        shell: bash
        run: |
          # Fastlane also interpolates this value into shell commands and paths.
          if [[ ! "$RELEASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9.+-]*$ ]]; then
            echo 'Invalid documentation version' >&2
            exit 1
          fi
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_26.6.app'
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Documentation report checks
        run: bundle exec ruby fastlane/tests/publish_documentation_results_test.rb
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: fastlane
        id: document
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p documentation-results
          set -o pipefail
          bundle exec fastlane document "version:$RELEASE_VERSION" 2>&1 | tee documentation-results/document.log
      - name: Annotate documentation failures and summarize results
        if: always() && (steps.document.outcome == 'success' || steps.document.outcome == 'failure')
        run: bundle exec fastlane run publish_documentation_results outcome:'${{ steps.document.outcome }}'
      - name: Upload documentation logs
        if: always() && (steps.document.outcome == 'success' || steps.document.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-logs
          path: documentation-results/document.log
          retention-days: 14
          if-no-files-found: error
